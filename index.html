		<i class="sky-star" style="--x:86%;--y:12%;--size:4px;--shine:.75;--twinkle:4.7s;--delay:-1.8s"></i>

		<i class="sky-star" style="--x:39%;--y:10%;--size:4px;--shine:.78;--twinkle:5.9s;--delay:-.6s"></i>
